<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>{% block title %}H+ Studio | Thiết kế kiến trúc & nội thất{% endblock %}</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/x-icon" href="/static/favicon.ico">

<meta name="description" content="H+ Studio chuyên thiết kế kiến trúc, nội thất, villa và nhà phố. Không gian sống tối giản, hiện đại, tinh tế.">

<link rel="stylesheet" href="/static/style.css?v=6">
<link rel="stylesheet" href="/static/css/home.css?v=6">
<link rel="stylesheet" href="/static/css/projects.css?v=6">
<link rel="stylesheet" href="/static/css/project-detail.css?v=6">
<link rel="stylesheet" href="/static/css/contact.css?v=6">
<link rel="stylesheet" href="/static/css/news.css?v=6">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" rel="stylesheet">

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

<a href="/" class="logo">
<img src="/static/logo.png" class="logo-img">
<span class="logo-text">Architecture - Interior Design</span>
</a>


<div class="menu-toggle">☰</div>

<div class="nav-links">
<a href="/">Home</a>
<a href="/projects">Projects</a>
<a href="/news">News</a>
<a href="/about">About</a>
</div>


</nav>

<div class="menu-overlay"></div>

<!-- CONTENT -->

<div class="content">

{% block content %}{% endblock %}

</div>


<!-- FOOTER -->

<footer class="footer">

<div class="footer-wrapper">

<div class="footer-left">

<p>Số 55 Nguyễn Đình Thi - Tam Thắng - TpHCM • hotline 866.62.58.68</p>

<div class="footer-social">

<a href="https://facebook.com/hplus.studio.vt">Facebook</a>
<a href="mailto:hplus.studio.vt@gmail.com">Email</a>
<a href="https://zalo.me/2736242473318265174">Zalo</a>

</div>

<p>© 2024 H+ studio</p>

</div>


<div class="footer-map">

<iframe
width="100%"
height="120"
style="border:0;border-radius:12px;"
loading="lazy"
referrerpolicy="no-referrer-when-downgrade"
src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d12907.336052858966!2d107.11080174663715!3d10.377921188954504!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x317571afba67e583%3A0x3fcf724217873e9b!2sH%2B%20studio!5e0!3m2!1svi!2sus!4v1773293899569!5m2!1svi!2sus">
</iframe>
</div>

</div>

</footer>


<script src="/static/slider.js"></script>

<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function(){

const toggle = document.querySelector(".menu-toggle");
const menu = document.querySelector(".nav-links");
const overlay = document.querySelector(".menu-overlay");

if(toggle){

toggle.addEventListener("click", function(){

menu.classList.toggle("active");
overlay.classList.toggle("active");

});

}

if(overlay){

overlay.addEventListener("click", function(){

menu.classList.remove("active");
overlay.classList.remove("active");

});

}

});

</script>


</body>
</html>
