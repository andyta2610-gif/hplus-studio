{% extends "base.html" %}
{% block content %}

<section class="section">

<h1 class="section-title">Tin Tức Chuyên Ngành</h1>

<div class="news-grid">

{% for n in news_list %}

<a href="{{ n.url }}" target="_blank" class="news-card">

<img src="{{ n.thumbnail }}">

<h3>{{ n.title }}</h3>

<p>{{ n.source }} • {{ n.date }}</p>

</a>

{% endfor %}

</div>

</section>

{% endblock %}
