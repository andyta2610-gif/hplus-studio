{% extends "base.html" %}
{% block content %}

<section class="section">

<h2 class="section-title">Tin Tức Chuyên Ngành</h2>

<div class="news-grid">

{% for n in news_list %}
<a href="{{n.link}}" target="_blank" class="news-card">

<img src="{{n.image}}" alt="{{n.title}}">

<div class="news-info">
<h3>{{n.title}}</h3>
<p>{{n.source}} • {{n.year}}</p>
</div>

</a>
{% endfor %}

</div>

</section>

{% endblock %}
