{% extends "base.html" %}

{% block content %}

<div style="
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 73vh;
    background: #f7f7f5;
    font-family: 'Inter', sans-serif;
">
    <div style="
        background: white;
        padding: 40px 60px;
        border-radius: 14px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        max-width: 500px;
        animation: fadeIn 0.6s ease-out;
    ">
        <div style="font-size: 60px; color: #4CAF50; margin-bottom: 10px;">
            ✔
        </div>

        <h2 style="font-size: 28px; margin-bottom: 10px; color: #222;">
            Cảm ơn bạn!
        </h2>

        <p style="font-size: 16px; color: #555; line-height: 1.6; margin-bottom: 25px;">
            Yêu cầu của bạn đã được gửi thành công.<br>
            Chúng tôi sẽ liên hệ lại trong thời gian sớm nhất.
        </p>

        <a href="/" style="
            display: inline-block;
            background: #c7b7a7;
            color: black;
            padding: 12px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.5s;
         ">
            Quay lại trang chủ
        </a>
    </div>
</div>

<style>
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

{% endblock %}
